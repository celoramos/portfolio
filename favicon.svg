<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- Fundo escuro alinhado ao tema GitHub do site -->
  <rect width="32" height="32" rx="7" fill="#1b1f23"/>
  
  <!-- Borda sutil em verde accent -->
  <rect x="1" y="1" width="30" height="30" rx="6" fill="none" stroke="#2dba4e" stroke-width="1.5" stroke-opacity="0.5"/>
  
  <!-- Símbolo de terminal > em verde -->
  <path d="M 6.5 10.5 L 11.5 16 L 6.5 21.5" fill="none" stroke="#2dba4e" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Iniciais MR em branco -->
  <text x="13.5" y="21.5" font-family="'JetBrains Mono', 'Space Grotesk', system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#ffffff" letter-spacing="-0.5">MR</text>
</svg>
